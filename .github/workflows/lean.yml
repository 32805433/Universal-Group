name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Build proof library without warnings
        run: lake --wfail build
      - name: Check axiom dependencies
        run: lake env lean AxiomAudit.lean
      - name: Build independent challenge
        run: lake build Challenge
